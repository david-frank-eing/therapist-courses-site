<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>השאר פרטים</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f0f2f8; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 36px 30px;
      max-width: 440px; width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
    }
    .prof-header { margin-bottom: 24px; }
    h1 { font-size: 1.35rem; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { color: #666; font-size: .9rem; line-height: 1.5; }
    label {
      display: block; font-size: .86rem; color: #444; font-weight: 500;
      margin-top: 16px; margin-bottom: 5px;
    }
    .req { color: #e44; }
    input, textarea, select {
      width: 100%; border: 1.5px solid #dde; border-radius: 10px;
      padding: 10px 13px; font-size: .95rem; font-family: inherit;
      direction: rtl; color: #222; background: #fafbff;
      transition: border-color .2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: #6c7fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    .btn {
      margin-top: 26px; width: 100%; background: #5b6af0;
      color: #fff; border: none; border-radius: 13px;
      padding: 14px; font-size: 1rem; cursor: pointer;
      font-family: inherit; font-weight: 600;
      transition: opacity .2s;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: .9; }
    .success {
      text-align: center; padding: 30px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .success-icon { font-size: 2.8rem; }
    .success-title { font-size: 1.2rem; font-weight: 600; color: #1a1a2e; }
    .success-sub { font-size: .9rem; color: #666; }
    .err { color: #d44; font-size: .84rem; margin-top: 10px; }
    .hidden { display: none !important; }
    .type-badge {
      display: inline-block; background: #eef; color: #5b6af0;
      font-size: .78rem; padding: 2px 10px; border-radius: 20px;
      margin-bottom: 12px; font-weight: 600;
    }
  </style>
</head>
<body>
<div class="card">
  <div id="form-wrap">
    <div class="prof-header">
      <div class="type-badge" id="type-badge">פנייה</div>
      <h1 id="prof-title">השאר פרטים</h1>
      <div class="subtitle" id="prof-sub">מלא את הפרטים ונחזור אליך בהקדם</div>
    </div>

    <form id="lead-form" novalidate>
      <!-- === THERAPY FIELDS === -->
      <div id="therapy-fields">
        <label>שם מלא <span class="req">*</span></label>
        <input type="text" id="f-name" autocomplete="name" placeholder="ישראל ישראלי">

        <label>טלפון <span class="req">*</span></label>
        <input type="tel" id="f-phone" autocomplete="tel" placeholder="050-0000000">

        <label>אימייל</label>
        <input type="email" id="f-email" autocomplete="email" placeholder="example@mail.com">

        <label>הערות</label>
        <textarea id="f-notes" placeholder="במה תוכל לעזור לי..."></textarea>
      </div>

      <!-- === EVENT FIELDS === -->
      <div id="event-fields" class="hidden">
        <label>שם איש קשר <span class="req">*</span></label>
        <input type="text" id="ef-name" autocomplete="name" placeholder="ישראל ישראלי">

        <label>טלפון <span class="req">*</span></label>
        <input type="tel" id="ef-phone" autocomplete="tel" placeholder="050-0000000">

        <label>תאריך האירוע (משוער)</label>
        <input type="date" id="ef-date">

        <label>סגנון האירוע</label>
        <select id="ef-style">
          <option value="">בחר סגנון...</option>
          <option value="חתונה">💍 חתונה</option>
          <option value="בר מצווה">✡️ בר / בת מצווה</option>
          <option value="מסיבה">🎉 מסיבה</option>
          <option value="עסקי">🏢 אירוע עסקי</option>
          <option value="אחר">📌 אחר</option>
        </select>

        <label>מספר אורחים משוער</label>
        <input type="number" id="ef-attendees" min="1" placeholder="100">

        <label>מיקום</label>
        <input type="text" id="ef-location" placeholder="תל אביב, אולם X...">

        <label>הערות / בקשות מיוחדות</label>
        <textarea id="ef-notes" placeholder="סגנון מוזיקה, בקשות מיוחדות..."></textarea>
      </div>

      <button type="submit" class="btn" id="submit-btn">שלח פרטים ▶</button>
      <div class="err hidden" id="err-msg"></div>
    </form>
  </div>

  <div id="success-wrap" class="success hidden">
    <div class="success-icon">✅</div>
    <div class="success-title">תודה! קיבלנו את הפרטים שלך</div>
    <div class="success-sub">נחזור אליך בהקדם</div>
  </div>
</div>

<script>
  const params  = new URLSearchParams(location.search);
  const slug    = params.get('slug') || '';
  const type    = params.get('type') || 'therapy'; // 'therapy' | 'event'
  const isEvent = type === 'event';

  // Show/hide correct field set
  if (isEvent) {
    document.getElementById('therapy-fields').classList.add('hidden');
    document.getElementById('event-fields').classList.remove('hidden');
    document.getElementById('type-badge').textContent = '🎵 פנייה לאירוע';
    document.getElementById('prof-title').textContent = 'פרטי האירוע';
    document.getElementById('prof-sub').textContent = 'מלא את הפרטים ונחזור אליך עם הצעת מחיר';
  } else {
    document.getElementById('type-badge').textContent = '💆 פנייה לטיפול';
    document.getElementById('prof-title').textContent = 'השאר פרטים';
    document.getElementById('prof-sub').textContent = 'מלא את הפרטים ונחזור אליך בהקדם';
  }

  document.getElementById('lead-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn    = document.getElementById('submit-btn');
    const errEl  = document.getElementById('err-msg');
    errEl.classList.add('hidden');

    // Collect fields
    let name, phone, payload;
    if (isEvent) {
      name  = document.getElementById('ef-name').value.trim();
      phone = document.getElementById('ef-phone').value.trim();
      payload = {
        slug, type,
        name, phone,
        date:      document.getElementById('ef-date').value || '',
        style:     document.getElementById('ef-style').value || '',
        attendees: document.getElementById('ef-attendees').value || '',
        location:  document.getElementById('ef-location').value.trim() || '',
        notes:     document.getElementById('ef-notes').value.trim() || ''
      };
    } else {
      name  = document.getElementById('f-name').value.trim();
      phone = document.getElementById('f-phone').value.trim();
      payload = {
        slug, type,
        name, phone,
        email: document.getElementById('f-email').value.trim() || '',
        notes: document.getElementById('f-notes').value.trim() || ''
      };
    }

    if (!name) { showErr('אנא מלא שם'); return; }
    if (!phone) { showErr('אנא מלא מספר טלפון'); return; }

    btn.disabled = true; btn.textContent = '...שולח';

    try {
      const res  = await fetch('/.netlify/functions/lead-capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'שגיאה');
      document.getElementById('form-wrap').classList.add('hidden');
      document.getElementById('success-wrap').classList.remove('hidden');
    } catch (err) {
      showErr('אופס, משהו השתבש. נסה שוב.');
      btn.disabled = false; btn.textContent = 'שלח פרטים ▶';
    }
  });

  function showErr(msg) {
    const el = document.getElementById('err-msg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
</script>
</body>
</html>
