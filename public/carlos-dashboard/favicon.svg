<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c8cff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1b1b2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0b4ff"/>
      <stop offset="100%" stop-color="#6c8cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#1b1b2f"/>

  <!-- Glow -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)"/>

  <!-- Border accent -->
  <rect width="32" height="32" rx="8" fill="none" stroke="#6c8cff" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Letter C -->
  <text x="16" y="22.5"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="20"
    font-weight="700"
    text-anchor="middle"
    fill="url(#letter)">C</text>

  <!-- Dot accent -->
  <circle cx="23" cy="10" r="2.5" fill="#6c8cff" opacity="0.9"/>
</svg>
