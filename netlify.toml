[build]
  command = "npm run build"
  publish = "dist"

# Scheduled function: refresh Google Calendar + Gmail at 07:00 Israel time (04:00 UTC)
[functions."google-scheduled-refresh"]
  schedule = "0 4 * * *"

[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888

[[headers]]
  for = "/carlos-dashboard/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://calendar.google.com; img-src 'self' data: blob: https:; media-src 'self' https://*.supabase.co;"
