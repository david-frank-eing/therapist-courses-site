[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/carlos-dashboard/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://calendar.google.com; img-src 'self' data: https:; media-src 'self';"
